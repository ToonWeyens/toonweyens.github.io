<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 560 360" role="img" font-family="'Anthropic Sans', ui-sans-serif, system-ui, sans-serif">
  <title>Chinook naive agent graph</title>
  <desc>The naive build: start enters the model; the model conditionally calls tools (a raw SQLDatabaseToolkit over the whole database) or ends; the tools node loops back to the model. A bare ReAct loop with no middleware. Solid edges are unconditional; dashed edges are conditional.</desc>

  <defs>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b5b66"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a9aa3"/></marker>
  </defs>

  <rect x="2" y="2" width="556" height="356" rx="14" fill="#ffffff" stroke="#e6e6ea"/>

  <!-- ============ EDGES ============ -->
  <!-- solid = unconditional -->
  <path d="M280,50 L280,84" fill="none" stroke="#5b5b66" stroke-width="2" marker-end="url(#as)"/>

  <!-- dashed = conditional -->
  <path d="M280,132 L280,204" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <path d="M348,109 H410" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <!-- loop: tools -> model (left lane) -->
  <path d="M150,235 H108 V109 H210" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <!-- edge labels -->
  <g font-size="10" fill="#7a7a83">
    <rect x="358" y="91" width="40" height="18" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
    <text x="378" y="103" text-anchor="middle">done</text>
  </g>
  <g font-size="10" fill="#7a7a83">
    <rect x="291" y="159" width="56" height="18" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
    <text x="319" y="171" text-anchor="middle">call tool</text>
  </g>
  <text x="92" y="172" font-size="10" fill="#9a9aa3" transform="rotate(-90 92 172)" text-anchor="middle">loop back</text>

  <!-- ============ NODES ============ -->
  <!-- start -->
  <rect x="220" y="14" width="120" height="36" rx="18" fill="#ececf0" stroke="#9a9aa3"/>
  <text x="280" y="37" text-anchor="middle" font-size="12.5" fill="#33333a">__start__</text>

  <!-- model -->
  <rect x="212" y="86" width="136" height="46" rx="8" fill="#f3f3f6" stroke="#8f8f99"/>
  <text x="280" y="113" text-anchor="middle" font-size="12.5" fill="#3a3a42">model</text>

  <!-- tools (raw SQL toolkit) -->
  <rect x="150" y="206" width="260" height="58" rx="8" fill="#f3f3f6" stroke="#8f8f99"/>
  <text x="280" y="230" text-anchor="middle" font-size="12.5" fill="#3a3a42">tools</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8a93">raw SQLDatabaseToolkit · arbitrary SQL, whole DB</text>

  <!-- end -->
  <rect x="412" y="88" width="108" height="38" rx="19" fill="#ececf0" stroke="#9a9aa3"/>
  <text x="466" y="112" text-anchor="middle" font-size="12.5" fill="#33333a">__end__</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="11" fill="#55555e">
    <line x1="170" y1="318" x2="202" y2="318" stroke="#5b5b66" stroke-width="2" marker-end="url(#as)"/>
    <text x="209" y="322">always</text>
    <line x1="290" y1="318" x2="322" y2="318" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
    <text x="329" y="322">conditional</text>
  </g>
  <text x="540" y="344" text-anchor="end" font-size="10" fill="#b4b4bb">naive build · bare ReAct loop, no middleware</text>
</svg>
