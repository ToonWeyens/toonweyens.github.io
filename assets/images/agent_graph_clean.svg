<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 690" role="img" font-family="'Anthropic Sans', ui-sans-serif, system-ui, sans-serif">
  <title>Chinook support agent middleware graph</title>
  <desc>The agent loop: start enters PIIMiddleware before_model (which redacts tool results), then model, then the after_model chain PII (inert), ToolCallLimit, HumanInTheLoop. HumanInTheLoop routes to tools (approve), back to before_model (reject), or end. The tools node loops back to before_model. Solid edges are unconditional; dashed edges are conditional.</desc>

  <defs>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b5b66"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a9aa3"/></marker>
  </defs>

  <rect x="2" y="2" width="676" height="686" rx="14" fill="#ffffff" stroke="#e6e6ea"/>

  <!-- ============ EDGES ============ -->
  <!-- solid = unconditional -->
  <path d="M320,52 L320,75" fill="none" stroke="#5b5b66" stroke-width="2" marker-end="url(#as)"/>
  <path d="M320,211 L320,241" fill="none" stroke="#5b5b66" stroke-width="2" marker-end="url(#as)"/>
  <path d="M320,297 L320,332" fill="none" stroke="#5b5b66" stroke-width="2" marker-end="url(#as)"/>

  <!-- dashed = conditional -->
  <path d="M320,131 L320,167" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <path d="M320,378 L320,416" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <path d="M157,442 C120,470 138,502 150,517" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <!-- reject: hitl -> before_model (far-left lane) -->
  <path d="M155,432 H57 V104 H167" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <!-- loop: tools -> before_model (far-left lane) -->
  <path d="M95,540 H35 V96 H167" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <!-- exits to end -->
  <path d="M470,104 C620,170 600,470 492,538" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <path d="M485,356 C575,405 560,500 472,538" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <path d="M485,440 C560,472 520,514 454,538" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <!-- edge labels -->
  <g font-size="10" fill="#6a5fb0">
    <rect x="70" y="474" width="58" height="18" rx="9" fill="#ffffff" stroke="#d9d6ee"/>
    <text x="99" y="486" text-anchor="middle">approve</text>
  </g>
  <g font-size="10" fill="#7a7a83">
    <rect x="486" y="497" width="44" height="18" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
    <text x="508" y="509" text-anchor="middle">done</text>
  </g>
  <text x="44" y="320" font-size="10" fill="#9a9aa3" transform="rotate(-90 44 320)" text-anchor="middle">loop back</text>

  <!-- ============ NODES ============ -->
  <!-- start -->
  <rect x="260" y="16" width="120" height="36" rx="18" fill="#ececf0" stroke="#9a9aa3"/>
  <text x="320" y="39" text-anchor="middle" font-size="12.5" fill="#33333a">__start__</text>

  <!-- before_model (subject, active) -->
  <rect x="170" y="77" width="300" height="54" rx="8" fill="#efeaff" stroke="#7c5cff" stroke-width="1.6"/>
  <text x="320" y="100" text-anchor="middle" font-size="12.5" fill="#4635b0">PIIMiddleware[email].before_model</text>
  <text x="320" y="117" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6a5fb0">redacts tool results</text>

  <!-- model -->
  <rect x="260" y="169" width="120" height="42" rx="8" fill="#f3f3f6" stroke="#8f8f99"/>
  <text x="320" y="194" text-anchor="middle" font-size="12.5" fill="#3a3a42">model</text>

  <!-- pii after_model (subject, inert) -->
  <rect x="170" y="243" width="300" height="54" rx="8" fill="#f5f5f7" stroke="#c5c0dd" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="320" y="266" text-anchor="middle" font-size="12.5" fill="#8d88a6">PIIMiddleware[email].after_model</text>
  <text x="320" y="283" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a09bb8">inert · apply_to_output=False</text>

  <!-- tool call limit -->
  <rect x="155" y="334" width="330" height="44" rx="8" fill="#f3f3f6" stroke="#8f8f99"/>
  <text x="320" y="361" text-anchor="middle" font-size="12.5" fill="#3a3a42">ToolCallLimitMiddleware.after_model</text>

  <!-- hitl -->
  <rect x="155" y="418" width="330" height="44" rx="8" fill="#f3f3f6" stroke="#8f8f99"/>
  <text x="320" y="445" text-anchor="middle" font-size="12.5" fill="#3a3a42">HumanInTheLoopMiddleware.after_model</text>

  <!-- tools -->
  <rect x="95" y="520" width="110" height="40" rx="8" fill="#f3f3f6" stroke="#8f8f99"/>
  <text x="150" y="544" text-anchor="middle" font-size="12.5" fill="#3a3a42">tools</text>

  <!-- end -->
  <rect x="415" y="541" width="110" height="38" rx="19" fill="#ececf0" stroke="#9a9aa3"/>
  <text x="470" y="565" text-anchor="middle" font-size="12.5" fill="#33333a">__end__</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="11" fill="#55555e">
    <line x1="24" y1="620" x2="56" y2="620" stroke="#5b5b66" stroke-width="2" marker-end="url(#as)"/>
    <text x="63" y="624">always</text>
    <line x1="150" y1="620" x2="182" y2="620" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
    <text x="189" y="624">conditional</text>
    <rect x="300" y="612" width="18" height="16" rx="3" fill="#f5f5f7" stroke="#c5c0dd" stroke-dasharray="4 3"/>
    <text x="324" y="624">inert node (no-op)</text>
  </g>
  <text x="660" y="666" text-anchor="end" font-size="10" fill="#b4b4bb">chinook support agent · middleware loop</text>
</svg>
