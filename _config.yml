profile_summary: > # summary of the profile
  Trained as a computational physicist and customer-facing enterprise AI architect.
  As I am able to focus on both technical and commercial questions, senior leadership relies on me to provide strategic guidance.
  I architect scalable and cost-effective data and AI solutions tailored to client objectives, resulting in production-grade enterprise systems.
  My background has provided me with deep proficiency in HPC, distributed and cloud computing, as well as modern ML/DL/AI techniques, coding and scripting methods.
  Additionally, I lecture in plasma physics and computational methods for HPC at Eindhoven University of Technology.


